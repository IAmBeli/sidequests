{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<div class="card mx-auto" style="max-width: 400px">
    <div class="card-body">
        <h1 class="h4 mb-3 txet-center">Sign up</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-solid theme-primary w-100">Sign up</button>
        </form>
        <p class="mt-3 mb-0 text-center">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
    </div>
</div>
{% endblock %}
