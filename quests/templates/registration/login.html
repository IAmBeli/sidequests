{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: 80vh">
    <div class="card" style="width: 100%; max-width: 400px">
        <div class="card-body">
            <h1 class="h4 mb-3 text-center">Log in</h1>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <input type="hidden" name="next" value="{{ next }}">
                <button type="submit" class="btn-solid theme-primary w-100">Log in</button>
            </form>
            <p class="mt-3 mb-0 text-center">No account? <a href="{% url 'register' %}">Sign up</a></p>
        </div>
    </div>
</div>
{% endblock %}
