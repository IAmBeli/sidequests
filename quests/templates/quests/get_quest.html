{% extends "base.html" %}
{% block title %}Get quest{% endblock %}
{% block content %}
<div class="card mx-auto" style="max-width: 560px">
    <div class="card-body text-center">
        <h1 class="h3 mb-4">Get a side quest</h1>
        <form method="post" class="d-flex justify-content-center gap-2">
            {% csrf_token %}
            <select name="difficulty" class="form-select w-auto">
                <option value="">Auto(easy or medium)</option>
                {% for value, label in difficulty_choices %}
                    <option value="{{ value }}">{{ label }}</option>
                {% endfor %}
            </select>
            <button type="submit" class="btn-solid theme-primary">Get quest</button>
        </form>
    </div>
</div>
{% endblock %}
